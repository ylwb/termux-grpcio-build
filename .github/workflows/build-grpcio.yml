name: build-grpcio-for-termux-aarch64

on:
  workflow_dispatch:
    inputs:
      GRPC_VERSION:
        description: "grpc source tag"
        required: false
        default: "v1.81.1"
      NDK_VERSION:
        description: "Android NDK version"
        required: false
        default: "r27d"
      PYTHON_VERSION:
        description: "target Python minor version"
        required: false
        default: "3.12"
      ENABLE_BORINGSSL_ASM:
        description: "enable boringssl asm optimizations"
        required: false
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRPC_VERSION: ${{ inputs.GRPC_VERSION || 'v1.81.1' }}
      NDK_VERSION: ${{ inputs.NDK_VERSION || 'r27d' }}
      PYTHON_VERSION: ${{ inputs.PYTHON_VERSION || '3.12' }}
      ENABLE_BORINGSSL_ASM: ${{ inputs.ENABLE_BORINGSSL_ASM || 'false' }}
      TARGET_ARCH: aarch64-linux-android
      BUILD_ARCH: x86_64

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Print NDK environment
        run: |
          set -euo pipefail
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-}"
          echo "NDK_HOME=${NDK_HOME:-}"
          echo "setup-ndk output path=${{ steps.setup-ndk.outputs.ndk-path }}"
          echo "setup-ndk full version=${{ steps.setup-ndk.outputs.ndk-full-version }}"
          echo "PATH head: $(echo "$PATH" | tr ':' '\n' | head -n 20 | tr '\n' ' ')"

      - name: Install host build dependencies
        run: |
          set -euo pipefail
          bash ci/install_host_deps.sh

      - name: Prepare target Python layout
        run: |
          set -euo pipefail
          bash ci/prepare_termux_python.sh

      - name: Fetch grpc source
        run: |
          set -euo pipefail
          bash ci/fetch_grpc.sh

      - name: Build grpcio
        run: |
          set -euo pipefail
          bash ci/build_grpcio.sh

      - name: Package artifact
        run: |
          set -euo pipefail
          bash ci/package_artifact.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: grpcio-termux-aarch64-py${{ inputs.PYTHON_VERSION || '3.12' }}
          path: dist

      - name: Print build report
        run: |
          set -euo pipefail
          bash ci/collect_report.sh
